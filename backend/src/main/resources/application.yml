spring:
  application:
    name: ${APP_NAME}
  profiles:
    active: ${PROFILE:test}
  jpa:
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [service=${spring.application.name}] [profile=${spring.profiles.active:default}] %msg%n"
  level:
    root: INFO
